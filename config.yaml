# 备注：此配置IPV6完全禁止
mode: rule
mixed-port: 7897
socks-port: 7898
port: 7899
allow-lan: true
bind-address: 0.0.0.0
log-level: info
unified-delay: false
ipv6: false
# 试用
#tcp-concurrent: true
#find-process-mode: strict
dns:
  # 匹配到直连走system，因为有些DNS服务器只在内网中
  # 匹配到代理走DOH
  # 未知域名匹配到GEOIP才会使用nameserver
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - system
    - 223.6.6.6
  nameserver:
    - system
    - https://223.5.5.5/dns-query
    # 【国内分流与隐私闸门配置说明】
    # 1. 国内加速：nameserver 锁死系统和阿里本地 DoH，确保国内大厂（如B站）即便使用GEO漏网的便宜 CDN 域名，也能物理直连、利用好CDN加速来秒速解析。
    # 2. 动态防漏：日常状态下“兜底组”必须选【DIRECT】，以兼容大厂野生 CDN。
    # 3. 隐私沙箱：访问海外高隐私/特殊冷门网站时，手动将“兜底组”切为【代理】，彻底封死 ISP 偷窥可能。看毕切回。
    # 4. 要是懒得来回切换，那么nameserver只用信任DOH得了
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - https://*/dns-query
    # 使用信任的DOH
  use-system-hosts: true
profile:
  store-selected: true

proxies:
# 自建示例模板（已脱敏）
- name: "1 美国Los |自建"
  type: vless
  server: *.loc.cc
  port: 52783
  uuid: *-*-*-*-*
  network: tcp
  tls: true
  udp: true
  flow: xtls-rprx-vision
  servername: www.apple.com
  client-fingerprint: chrome
  packet-encoding: xudp
  reality-opts:
    public-key: *
    short-id: *

proxy-providers:
  # 机场订阅示例模板（已脱敏）
  peiqian-Chain:
    type: http
    url: "https://*/api/v1/pq/*"
    path: ./proxy_providers/peiqian-Chain.yaml
    interval: 3600
    size-limit: 0
    header:
      User-Agent:
      - "clash-verge/v2.2.3"
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 3000
      lazy: true
      expected-status: 204
    override:
      tfo: false
      mptcp: false
      udp: true
      udp-over-tcp: false
      skip-cert-verify: false
      dialer-proxy: "链式中间节点"
      ip-version: ipv4-prefer
      additional-prefix: "peiqian| "
      additional-suffix: " |链式"

proxy-groups:
  # 通用主控组
  - name: "手动选择兜底国家"
    type: select
    proxies: ["自建-节点组", "链式代理-通用", "港台日新韩-节点组", "香港-节点组", "台湾-节点组", "日本-节点组", "新加坡-节点组", "韩国-节点组", "美国-节点组", "全部节点"]
  # 链式代理-中间节点组
  - name: "链式中间节点"
    type: select
    proxies: ["自建-节点组", "港台日新韩-节点组", "香港-节点组", "台湾-节点组", "日本-节点组", "新加坡-节点组", "韩国-节点组", "美国-节点组"]
  # 链式终节点-通用
  - name: "链式代理-通用"
    type: select
    include-all: true
    filter: ".*链式$"
  # 自建-节点组
  - name: "自建-节点组"
    type: select
    include-all: true
    filter: ".*自建.*"
  # 规则分流组
  - name: "GPT-节点组"
    type: select
    include-all: true
    filter: ".*链式$"
    proxies: ["手动选择兜底国家", "美国-节点组"]
  - name: "Gemini-节点组"
    type: select
    include-all: true
    filter: ".*链式$"
    proxies: ["手动选择兜底国家", "链式代理-通用"]
  - name: "Claude-节点组"
    type: select
    include-all: true
    filter: ".*链式$"
    proxies: ["手动选择兜底国家", "美国-节点组"]
  - name: "Telegram-节点组"
    type: select
    include-all: true
    filter: ".*链式$"
    proxies: ["手动选择兜底国家", "链式代理-通用"]
  - name: "Spotify-节点组"
    type: select
    include-all: true
    filter: ".*链式$"
  - name: "PSN-节点组"
    type: select
    include-all: true
    filter: ".*链式$"
    proxies: ["链式代理-通用", "香港-节点组", "手动选择兜底国家", "美国-节点组", "日本-节点组"]
  # 全部节点(用来看的，几乎不用)
  - name: "全部节点"
    type: select
    include-all: true
  - name: "各机场流量剩余展示"
    type: select
    include-all: true
    filter: '.*流量[^0-9]*([0-9]+(\.[0-9]+)?)\s*[Gg][Bb]'
  # 国家组
  - name: "美国-节点组"
    type: select
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 100
    timeout: 1800
    filter: ^(?!.*游戏)(?=.*(美国|US)).*?
  - name: "港台日新韩-节点组"
    type: url-test
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    timeout: 1000
    filter: ^(?!.*游戏)(?!.*25x)(?=.*(香港|HK|台湾|TW|新加坡|SG|日本|JP|韩国|KR)).*\|无链$
  - name: "香港-节点组"
    type: fallback
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    timeout: 800
    filter: ^(?!.*游戏)(?=.*(香港|HK)).*?\|无链$
  - name: "台湾-节点组"
    type: fallback
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    timeout: 1000
    filter: ^(?!.*游戏)(?=.*(台湾|TW)).*?\|无链$
  - name: "日本-节点组"
    type: fallback
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    timeout: 1200
    filter: ^(?!.*游戏)(?!.*25x)(?=.*(日本|JP)).*?\|无链$
  - name: "新加坡-节点组"
    type: fallback
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    timeout: 1200
    filter: ^(?!.*游戏)(?=.*(新加坡|SG)).*?\|无链$
  - name: "韩国-节点组"
    type: url-test
    include-all: true
    url: "http://www.gstatic.com/generate_204"
    interval: 60
    tolerance: 50
    timeout: 1300
    filter: ^(?!.*游戏)(?=.*(韩国|KR)).*?\|无链$
  # 兜底Match组
  - name: "兜底组"
    type: select
    proxies: [DIRECT, "手动选择兜底国家"]
rule-providers:
  Claude:
    type: http
    path: ./rules/Claude.yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Claude/Claude.yaml"
    interval: 86400
    proxy: 手动选择兜底国家
    behavior: classical
    format: yaml

rules:
  # 特殊自定义域名
  - DOMAIN-SUFFIX,gog.com,DIRECT
  - DOMAIN-SUFFIX,epicgames.com,DIRECT
  - DOMAIN-KEYWORD,bing,DIRECT
  - DOMAIN-KEYWORD,sohu,DIRECT
  - DOMAIN-REGEX,^dl.*mypikpak\.com$,DIRECT
  - DOMAIN-SUFFIX,googleapis.cn,手动选择兜底国家 
  - DOMAIN,zeze.teracloud.jp,DIRECT
  - DOMAIN-SUFFIX,shanyu520.com,DIRECT
  - DOMAIN-SUFFIX,devsleep.com,DIRECT
  - DOMAIN-SUFFIX,uiauto.dev,DIRECT
  # 规则集
  - GEOSITE,category-games@CN,DIRECT
  - GEOSITE,openai,GPT-节点组
  - GEOSITE,google-gemini,Gemini-节点组
  - GEOSITE,telegram,Telegram-节点组
  - GEOSITE,spotify,Spotify-节点组
  - GEOSITE,playstation,PSN-节点组
  - GEOSITE,sony,PSN-节点组
  - RULE-SET,Claude,Claude-节点组
  # 进程匹配(Windows)
  - PROCESS-NAME,Telegram.exe,Telegram-节点组  
  - PROCESS-NAME,steam.exe,手动选择兜底国家  
  - PROCESS-NAME,claude.exe,Claude-节点组  
  - PROCESS-NAME,VALORANT.exe,全部节点  
  - PROCESS-NAME,VALORANT-Win64-Shipping.exe,全部节点  
  - PROCESS-NAME,RiotClientServices.exe,全部节点  
  - PROCESS-NAME,AimLab.exe,全部节点  
  - PROCESS-NAME,AimLabExe.exe,全部节点  
  # 进程匹配(Android)
  - PROCESS-NAME,mark.via,手动选择兜底国家  
  - PROCESS-NAME,mark.via.gp,手动选择兜底国家  
  - PROCESS-NAME,com.spotify.music,Spotify-节点组  
  - PROCESS-NAME,com.microsoft.outlooklite,手动选择兜底国家  
  - PROCESS-NAME,com.valvesoftware.android.steam.community,手动选择兜底国家  
  - PROCESS-NAME,com.github.android,手动选择兜底国家  
  - PROCESS-NAME,com.openai.chatgpt,GPT-节点组  
  - PROCESS-NAME,com.anthropic.claude,Claude-节点组  
  - PROCESS-NAME,org.telegram.messenger,Telegram-节点组  
  - PROCESS-NAME,org.thunderdog.challegram,Telegram-节点组  
  - PROCESS-NAME,com.twitter.android,手动选择兜底国家  
  - PROCESS-NAME,com.android.vending,手动选择兜底国家  
  # 国家规则
  - GEOSITE,geolocation-!cn,手动选择兜底国家
  - GEOSITE,CN,DIRECT
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  # 本机进程兜底
  - PROCESS-NAME,firefox.exe,手动选择兜底国家  
  - PROCESS-NAME-REGEX,(?i)Chrome,手动选择兜底国家 
  - PROCESS-NAME-REGEX,(?i)^(Safari|com\.apple\.WebKit),手动选择兜底国家 
  # 局域网客户端兜底
  - SRC-IP-CIDR,10.2.0.0/16,手动选择兜底国家
  - SRC-IP-CIDR,192.168.0.0/16,手动选择兜底国家
  # 最终兜底
  - MATCH,兜底组
